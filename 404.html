<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>404 | Página no encontrada</title>

    <!-- Favicon -->
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="./favicon.ico" sizes="any" />

    <style>
        :root{
        color-scheme: dark;
        --bg: #0b1220;
        --card: rgba(255,255,255,.06);
        --text: rgba(255,255,255,.92);
        --muted: rgba(255,255,255,.70);
        --border: rgba(255,255,255,.12);
        --accent: #7c3aed;
        --accent2:#22c55e;
        }
        *{ box-sizing: border-box; }
        body{
        margin:0;
        min-height:100vh;
        display:grid;
        place-items:center;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
        background:
            radial-gradient(1000px 600px at 20% 10%, rgba(124,58,237,.25), transparent 55%),
            radial-gradient(1000px 600px at 80% 90%, rgba(34,197,94,.18), transparent 55%),
            var(--bg);
        color:var(--text);
        padding: 24px;
        }
        .card{
        width:min(760px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 28px;
        box-shadow: 0 20px 60px rgba(0,0,0,.45);
        backdrop-filter: blur(10px);
        }
        .row{
        display:flex;
        gap:20px;
        align-items:flex-start;
        flex-wrap:wrap;
        }
        .badge{
        display:inline-flex;
        align-items:center;
        gap:10px;
        padding: 10px 14px;
        border-radius: 999px;
        border:1px solid var(--border);
        background: rgba(0,0,0,.15);
        font-weight: 700;
        letter-spacing:.2px;
        }
        .badge b{
        font-size: 18px;
        color: white;
        }
        h1{
        margin: 14px 0 8px;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.1;
        }
        p{
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.55;
        }
        .actions{
        display:flex;
        gap:12px;
        flex-wrap:wrap;
        margin-top: 18px;
        }
        a.btn{
        display:inline-flex;
        align-items:center;
        justify-content:center;
        gap:10px;
        padding: 12px 16px;
        border-radius: 12px;
        border:1px solid var(--border);
        background: rgba(0,0,0,.18);
        color: white;
        text-decoration:none;
        font-weight: 700;
        transition: transform .12s ease, border-color .12s ease, background .12s ease;
        }
        a.btn:hover{
        transform: translateY(-1px);
        border-color: rgba(255,255,255,.22);
        background: rgba(0,0,0,.26);
        }
        a.primary{
        border-color: rgba(124,58,237,.65);
        background: rgba(124,58,237,.22);
        }
        a.primary:hover{
        border-color: rgba(124,58,237,.95);
        background: rgba(124,58,237,.28);
        }
        code{
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        color: rgba(255,255,255,.85);
        background: rgba(0,0,0,.22);
        border: 1px solid var(--border);
        padding: 2px 8px;
        border-radius: 10px;
        display:inline-block;
        margin-top: 8px;
        }
        .hint{
        margin-top: 10px;
        font-size: 13px;
        color: rgba(255,255,255,.55);
        }
    </style>
</head>

<body>
    <main class="card" role="main">
        <div class="row">
            <div class="badge" aria-label="Error 404">
                <span>ERROR</span> <b>404</b> <span style="opacity:.75">Página no encontrada</span>
            </div>
        </div>

        <h1>Esta ruta no existe</h1>
        <p>
            Puede que el enlace esté mal escrito o que la página se haya movido.
            Regresá al inicio o revisá tu URL.
        </p>

        <code id="path"></code>
        <div class="actions">
            <a class="btn primary" href="/Portafolio_JonathanCv/">🏠 Ir al inicio</a>
            <a class="btn" href="/Portafolio_JonathanCv/cv.html">📄 Ver CV</a>
        </div>

        <p class="hint">Si renombrás el repo, actualizá los links de arriba.</p>
    </main>

    <script>
        document.getElementById("path").textContent = "Ruta: " + location.pathname;
    </script>
</body>
</html>
