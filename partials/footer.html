<footer id="contact">
    <h3>
        <span id="role" style="color: #000000;" data-i18n="footer.title">Contactar mi Gmail</span>
    </h3>

    <form id="contact-form">
        <input type="text" name="name" placeholder="Tu nombre" data-i18n-placeholder="footer.namePlaceholder" required>
        <input type="email" name="email" placeholder="Tu correo" data-i18n-placeholder="footer.emailPlaceholder" required>
        <textarea name="message" placeholder="Tu mensaje" data-i18n-placeholder="footer.messagePlaceholder" required></textarea>
        <button type="submit" data-i18n="footer.send">Enviar mensaje</button>
    </form>

    <p style="color: #fff;">.</p>
    <p data-i18n="footer.quote">"Con fe y esfuerzo, todo proyecto se alcanza; el Señor me guía y su paz me acompaña."</p>
    <p data-i18n="footer.rights">&copy; 2025 Jonathan García. Todos los derechos reservados.</p>
</footer>
